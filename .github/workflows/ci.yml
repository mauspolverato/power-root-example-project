name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end demo (offline fixtures + browser QA)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run demo
      - name: Require all 3 fixture demos to pass QA
        run: test "$(grep -l '^PASSED' output/reports/*/analysis.md | wc -l)" -eq 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-output
          path: output/
          retention-days: 7
